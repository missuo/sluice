[package]
name = "sluice"
version = "0.0.1"
edition = "2021"
description = "A config-driven edge proxy on Pingora. Routes and regulates HTTP traffic from a KDL config, no recompile per change."
license = "MIT"

[dependencies]
pingora = { version = "0.8", default-features = false, features = ["proxy", "connection_filter"] }
async-trait = "0.1"
http = "1"
arc-swap = "1"
kdl = { version = "6", features = ["v1"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
prometheus = "0.14"
signal-hook = "0.3"
maxminddb = "0.28"
ipnet = "2"
dashmap = "6"
bytes = "1"
instant-acme = "0.8"
serde_json = "1"
pingora-cache = "0.8"
pingora-error = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "io-util", "net", "sync"] }
# Pure-Rust X.509 parser: reads the leaf certificate's `notAfter` to schedule
# ACME renewal from real expiry (not file mtime). Backend-neutral — it does no
# TLS and links neither OpenSSL nor BoringSSL, so it behaves identically under
# both `--features openssl` and `--features boringssl` (Pingora's TLS facade
# doesn't re-export the ASN.1 date APIs).
x509-parser = "0.18"

[lib]
name = "sluice"
path = "src/lib.rs"

[[bin]]
name = "sluice"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tokio-test = "0.4"
# Self-signed cert generation for the TLS-handshake-timeout and cert-dir hot-reload
# regression tests (uses `ring` to avoid an aws-lc C toolchain build).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Set explicit notAfter/notBefore on generated test certs so the ACME
# notAfter-based renewal schedule can be exercised (>30d keep, <=30d/expired
# renew). Pinned to the version rcgen already resolves.
time = "0.3"
# H2 client for the downstream-H2 idle-timeout regression test (drives the real
# vendored accept loop over an in-memory duplex).
h2 = "0.4"

[[bench]]
name = "hot"
harness = false

[features]
# Default is OpenSSL — verified working behind Cloudflare (OpenSSL 3.5.x origin,
# no 525). BoringSSL is an OPTIONAL alternative (Cloudflare's own stack, static
# binary) for those who want it, not a requirement:
#   cargo build --release --no-default-features --features boringssl
# Note: rustls is NOT usable here — pingora's rustls backend has no TLS cert
# callback, so dynamic/SNI certs (cert-dir, ACME) don't work with it.
default = ["openssl"]
openssl = ["pingora/openssl"]
boringssl = ["pingora/boringssl"]
rustls = ["pingora/rustls"]

[profile.release]
lto = true
codegen-units = 1

# Vendored, minimally-patched `pingora-core` (see vendor/pingora-core/PATCH.md).
# 0.8.1 is the latest published release (`cargo search pingora` → 0.8.1), so there
# is no version bump available; the one-function fix (a HEAD request receiving an
# interim 1xx must NOT end the response before the final header) can only be
# carried as a local fork applied here. Remove this once the fix lands upstream.
[patch.crates-io]
pingora-core = { path = "vendor/pingora-core" }
