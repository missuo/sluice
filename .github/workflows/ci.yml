name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 runs on Node 24 (v4 targeted the now-deprecated Node 20).
      - uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Smoke config must validate (strict exit 0)
        # examples/smoke.kdl is self-contained (ACME TLS, no cert/static files),
        # so `--check` MUST exit 0. This catches KDL syntax errors, panics, and
        # schema regressions with an unambiguous pass/fail — unlike the full
        # example below, whose absent cert/static paths force a non-zero exit.
        run: ./target/debug/sluice --check -c examples/smoke.kdl

      - name: Validate full example config
        # The example references paths that don't exist in CI (certs, static
        # roots), so a non-zero exit is expected. We assert only that the binary
        # gets far enough to report those *filesystem* errors and emits no
        # schema/type error line — those would be real regressions.
        run: |
          out=$(./target/debug/sluice --check -c examples/sluice.kdl 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -Ei 'unknown (property|directive|child)|takes no properties|given more than once|must be (an integer|a number|true|false|a quoted)|expected .* argument'; then
            echo "::error::example config produced a schema/type error"
            exit 1
          fi
