name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA (a moved/compromised tag can't
# inject code into CI); the human-readable version is kept in the trailing
# comment. All are CURRENT majors running on Node 24 — checkout v5,
# Swatinem/rust-cache v2, taiki-e/install-action v2, dtolnay/rust-toolchain
# stable — no Node 20 actions remain. Dependabot (.github/dependabot.yml)
# proposes reviewed SHA bumps weekly.
#
# The Rust toolchain is intentionally kept at `stable` (not a pinned version):
# clippy/rustfmt lints evolve and CI should track them, while the ACTION that
# installs the toolchain is SHA-pinned, which is where the supply-chain risk is.

jobs:
  test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 runs on Node 24 (v4 targeted the now-deprecated Node 20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Swatinem/rust-cache (Node 24) instead of actions/cache@v4 (Node 20).
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Smoke config must validate (strict exit 0)
        # examples/smoke.kdl is self-contained (ACME TLS, no cert/static files),
        # so `--check` MUST exit 0. This catches KDL syntax errors, panics, and
        # schema regressions with an unambiguous pass/fail — unlike the full
        # example below, whose absent cert/static paths force a non-zero exit.
        run: ./target/debug/sluice --check -c examples/smoke.kdl

      - name: Validate full example config (EXACT expected errors)
        # The example references paths absent in CI (certs, static roots), so a
        # non-zero exit is expected. We assert the output is EXACTLY: 1 header +
        # 1 cert-not-found + 2 root-not-a-directory = 4 lines, with those exact
        # counts. Any extra line, a different count, a panic, or a new error type
        # fails the job — so a newly-introduced error (bad regex, semantic check,
        # schema regression) can't hide behind a substring match.
        run: |
          set +e
          out=$(./target/debug/sluice --check -c examples/sluice.kdl 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -ne 0 ] || { echo "::error::expected non-zero exit"; exit 1; }
          total=$(printf '%s\n' "$out" | grep -c .)
          headers=$(printf '%s\n' "$out" | grep -c '^config error in ')
          certs=$(printf '%s\n' "$out" | grep -c ': cert file not found: ')
          roots=$(printf '%s\n' "$out" | grep -c ': file-server root not usable: ')
          echo "lines=$total header=$headers cert=$certs root=$roots"
          if [ "$headers" -ne 1 ] || [ "$certs" -ne 1 ] || [ "$roots" -ne 2 ] || [ "$total" -ne 4 ]; then
            echo "::error::--check output is not the exact expected error set (1 header + 1 cert + 2 root = 4 lines)"
            exit 1
          fi
          # Belt-and-suspenders: every NON-BLANK line must match an allowed
          # pattern, so a new error that happened to keep the counts (it can't,
          # given the exact counts above, but be explicit) is still caught.
          printf '%s\n' "$out" | grep . | grep -vqE '^config error in |: cert file not found: |: file-server root not usable: ' \
            && { echo "::error::unexpected --check line present"; exit 1; } || true

  boringssl:
    name: build / test (BoringSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: boringssl
      # BoringSSL (boring-sys) needs these beyond the C toolchain on Ubuntu.
      - name: Install BoringSSL build deps
        run: sudo apt-get update && sudo apt-get install -y golang-go nasm ninja-build cmake clang
      - name: Build (BoringSSL)
        run: cargo build --no-default-features --features boringssl --verbose
      - name: Test (BoringSSL)
        run: cargo test --no-default-features --features boringssl --verbose

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-audit
      # Audits with ZERO ignores. RUSTSEC-2024-0437 (protobuf 2.28, transitive
      # via `prometheus`) is RESOLVED — both the direct and vendored
      # `pingora-core` prometheus deps are on 0.14, which pulls protobuf >= 3.7.
      # Any advisory now fails this job.
      - run: cargo audit
