name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Validate example config
        # The example references paths that don't exist in CI (certs, static
        # roots), so a non-zero exit is expected; we only assert the binary
        # parses far enough to report those *filesystem* errors and not a
        # schema/type error. Any "unknown"/"must be" line is a real failure.
        run: |
          out=$(./target/debug/sluice --check -c examples/sluice.kdl 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -Ei 'unknown (property|directive|child)|must be (an integer|true|false|a quoted)'; then
            echo "::error::example config produced a schema/type error"
            exit 1
          fi
