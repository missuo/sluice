user root;
pid /srv/bench/run/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /srv/bench/log/nginx.err;
events { worker_connections 10240; }
http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 10000000;
    server {
        listen 127.0.0.1:18083 ssl;
        ssl_certificate /srv/bench/cert.pem;
        ssl_certificate_key /srv/bench/key.pem;
        root /srv/bench/www;
    }
}
