pid /srv/bench/run/origin.pid;
worker_processes 4;
worker_rlimit_nofile 65535;
error_log /srv/bench/log/origin.err;
events { worker_connections 10240; }
http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 10000000;
    server {
        listen 127.0.0.1:18000;
        root /srv/bench/origin;
    }
}
